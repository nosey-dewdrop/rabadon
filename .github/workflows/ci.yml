name: ci

# Until now the only workflow in this repo was release.yml, which runs when a
# tag is pushed. Nothing ran on a push or a pull request — the suites that prove
# every claim in the README were run by hand, on one machine, on one OS. A
# stranger reading the repo had no way to see them pass, and a regression had
# nothing to trip over.
#
# Both halves run here, on both supported platforms x both supported Node
# lines (2 x 2 = 4 cells):
#   make all && make test   the native core (gate, ledger, sandbox, repair)
#   npm test                the JS half (installer, ui server, store, bus)
# `make test` includes npm_install_test.sh, which packs the tarballs and
# installs them into a clean prefix — the published path is exercised on every
# push, because it is the path that was broken and nobody noticed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} node${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # a red macOS must not hide a green linux
      matrix:
        # ubuntu-latest ON PURPOSE, while release.yml pins ubuntu-22.04. They
        # want opposite things and both are right: a release must build against
        # the OLDEST glibc it supports, so its binaries run everywhere; CI must
        # build against the NEWEST toolchain, so a header that only compiles by
        # accident is caught here instead of in someone's terminal. The very
        # first run of this file proved the gap — verify.cpp used uint64_t
        # without including <cstdint> and had never compiled on a modern
        # libstdc++, while the release matrix stayed green on the older one.
        os: [ubuntu-latest, macos-15]
        # Two Node lines, not one. package.json declares engines >=18 and CI
        # only ever ran 22, so the whole range below it was an untested claim.
        # 20 is here for a specific reason: release.yml publishes on Node 20
        # (publish and smoke both pin node-version: "20"), so the version that
        # cuts and installs the tarballs is now the version CI proves first.
        # The published path is the tested path. 22 stays as the newest line,
        # to catch what only breaks on the newer runtime.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: compiler
        run: c++ --version

      # Without bubblewrap the sandbox suite reports "1 passed, 0 failed" and
      # skips every enforcement assertion — so the README's hardest claim, a
      # forbidden write refused by the KERNEL with EPERM, was proven on macOS
      # Seatbelt and never once on Linux, on either linux target we publish.
      # A skip that reads as a pass is worse than a failure.
      #
      # The sysctl is not a CI trick: Ubuntu 24.04+ blocks unprivileged user
      # namespaces through AppArmor, so bwrap installs and cannot start
      # ("setting up uid map: Permission denied"). rabadon now detects that and
      # says so instead of reporting a fence it does not have — this line is
      # what lets CI test the fence WORKING, which is the other half.
      - name: bubblewrap (the linux sandbox backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / /bin/true && echo "bwrap can start" || echo "bwrap still blocked — the suite will skip and say so"

      - name: build the native core
        run: make all

      - name: native suites
        run: make test

      - name: js suites
        run: npm test

  # THE DISCLOSURE GATE, on both platforms, as its own job.
  #
  # It used to run last inside `make test`. It is red on purpose — it stays red
  # until a human has decided about every project name in the published
  # artifacts — and `make test` is what rabadon's own red-base law runs on this
  # repository, so a deliberate red was refusing every action in rabadon's own
  # tree, including the actions doing the triage. A suite designed to fail
  # cannot also be the gate (Makefile, above `promises`).
  #
  # It is a JOB and not a step of the one above, so a red here cannot mask a
  # green there and vice versa: two verdicts, both visible, neither hiding the
  # other. Nothing about the check itself was weakened to move it — same suite,
  # same fail-closed allowlist, and it fails this workflow on every push until
  # the names are decided. It is exactly as loud as it was and no longer aimed
  # at the wrong law.
  #
  # No compiler and no build: it reads python3 and site/.
  disclosure:
    name: disclosure ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # the same red on both platforms is worth seeing twice
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: every published project name was decided
        run: make disclosure
