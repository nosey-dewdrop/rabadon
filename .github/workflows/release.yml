# rabadon release — build the native core on every target, publish the four
# prebuilt platform packages + the main package with npm provenance.
#
# Triggered by pushing a tag like v0.2.0. The build is reproducible
# (SOURCE_DATE_EPOCH + -ffile-prefix-map); Linux binaries are statically
# linked so they run on any glibc/musl box. Provenance (--provenance) mints a
# sigstore attestation tying each npm tarball to THIS workflow run and commit,
# which a security-minded audience can verify.
#
# Secrets required (set once by the maintainer):
#   NPM_TOKEN — an npm automation token with publish rights to `rabadon`
#               and the `@rabadon` scope (create the org: npm org create rabadon).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for npm provenance (sigstore OIDC)

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # A retired runner label does not fail the job — it QUEUES FOREVER,
          # and with fail-fast that silently strands the whole release. Caught
          # on the 31.07 dry-run: macos-13 (retired 2025-12) sat queued while
          # the other three targets went green. macos-14 entered deprecation
          # on 2026-07-06. Re-check these labels before every release.
          - target: darwin-arm64
            os: macos-15         # Apple silicon runner
          - target: darwin-x64
            os: macos-15-intel   # Intel runner (last Intel line, retires Fall 2027)
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Give the suite the toolchain it grades with (best effort)
        # Twelve cases in `make test` drive a real python project through the
        # arbiter. A runner with no pytest cannot grade them, and until 5 August
        # it did not say so: v0.2.1 died on four of them in harness_lock_test.sh
        # and v0.2.2 died on eight in heldout_test.sh, both reporting a verdict
        # they never measured. Both files now ask for their toolchain and count
        # what they skipped, so a missing pytest costs coverage and no longer
        # costs the release.
        #
        # Which is exactly why this step may not fail the job. It buys back the
        # twelve cases when it can, and `make test` prints how many went ungraded
        # when it cannot. A publish pipeline that a pip mirror can take down is a
        # worse trade than twelve cases marked NOT JUDGED in the log.
        continue-on-error: true
        run: |
          set -u
          python3 -m pip install --quiet --disable-pip-version-check pytest \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pytest \
            || true
          python3 -m pytest --version \
            || echo "no pytest on this runner — those cases will report as NOT JUDGED, by design"
      - name: Build the native core (reproducible)
        env:
          SOURCE_DATE_EPOCH: "1"
        run: |
          set -euo pipefail
          EXTRA="-ffile-prefix-map=$PWD=."
          case "${{ matrix.target }}" in
            linux-*) EXTRA="$EXTRA -static-libstdc++ -static-libgcc" ;;
          esac
          make all CXXFLAGS="-std=c++17 -O2 -Wall -Wextra $EXTRA"
          make test
      - name: Stage binaries into the platform package
        run: |
          set -euo pipefail
          cp native/rabadon-gate native/rabadon-stats native/rabadon-drift \
             native/rabadon-trace native/rabadon-verify native/rabadon-pipeline \
             native/rabadon-do native/rabadon-budget native/rabadon-lens \
             native/rabadon-net native/rabadon-truth native/rabadon-serve \
             native/rabadon-audit native/rabadon-claims native/rabadon-repair native/rabadon-sandbox \
             native/rabadon-export \
             npm/${{ matrix.target }}/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: npm/${{ matrix.target }}/
          retention-days: 3

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Restore the built platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: npm-staged
      - name: Place binaries back under npm/<target>
        run: |
          set -euo pipefail
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            cp npm-staged/pkg-$t/rabadon-* npm/$t/
            chmod +x npm/$t/rabadon-*
          done
      - name: Version sanity — every manifest matches the tag
        run: node scripts/prepare-release.mjs --check "${GITHUB_REF_NAME#v}"
      - name: Publish platform packages (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            npm publish --access public --provenance ./npm/$t
          done
      - name: Publish the main package (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  smoke:
    name: install from the registry on ${{ matrix.os }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wait for the registry to serve this version
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if npm view "rabadon@$V" version >/dev/null 2>&1; then
              echo "the registry serves rabadon@$V"; exit 0
            fi
            echo "attempt $i — rabadon@$V is not on the registry yet"; sleep 10
          done
          echo "rabadon@$V never appeared on the registry"; exit 1
      - name: Install it the way a stranger would
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          npm i -g "rabadon@$V"
          command -v rabadon
      - name: The installed thing has to refuse something
        # The publish job proves a tarball reached the registry. It proves
        # nothing about whether the prebuilt binary for this platform came down
        # with it, is executable, and enforces. Until 5 August that half was
        # UNMEASURED for every platform: the package was not on the registry at
        # all, so the only path anyone had ever run was a local tarball.
        #
        # The guard is written here by hand on purpose. `rabadon init` authors
        # rules with a model, and a release gate that needs a model to pass is a
        # release gate that fails when the model is slow.
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/smoke"
          mkdir -p "$P/.rabadon"
          cat > "$P/.rabadon/guard.json" <<'JSON'
          {
            "project": "smoke",
            "bash": [
              { "id": "no-force-push-main",
                "deny": "git\\s+push[^|;&]*(--force|-f)\\b[^|;&]*\\b(main|master)\\b",
                "why": "post-publish smoke: force-pushing a shared branch destroys history",
                "catches": ["git push --force origin main"] }
            ],
            "protectedPaths": [],
            "disabled": []
          }
          JSON
          rabadon on
          GATE="$(npm root -g)/rabadon/hooks/gate.mjs"
          [ -f "$GATE" ] || { echo "the installed package has no hooks/gate.mjs at $GATE"; exit 1; }

          ev() { printf '{"hook_event_name":"PreToolUse","session_id":"smoke-%s","cwd":"%s","tool_name":"Bash","tool_input":{"command":"%s"}}' "$1" "$P" "$2"; }

          set +e
          ev danger "git push --force origin main" | node "$GATE" > "$RUNNER_TEMP/danger.out" 2>&1
          DANGER=$?
          ev safe "git status --short" | node "$GATE" > "$RUNNER_TEMP/safe.out" 2>&1
          SAFE=$?
          set -e

          echo "--- what an agent would have been shown ---"
          cat "$RUNNER_TEMP/danger.out"
          echo "--- dangerous exit $DANGER (want 2), safe exit $SAFE (want 0) ---"

          # both halves. A gate that refuses everything is not a gate, it is an
          # outage, and it passes any check that only ever sends it a bad command.
          [ "$DANGER" -eq 2 ] || { echo "the installed gate did NOT refuse a force-push"; exit 1; }
          [ "$SAFE" -eq 0 ]   || { echo "the installed gate refused an ordinary command"; exit 1; }
          grep -q "rabadon BLOCKED this action" "$RUNNER_TEMP/danger.out"

          # and the path the README sells, which is the one a stranger types.
          cd "$P" && rabadon drill | tee "$RUNNER_TEMP/drill.out"
          grep -q "the gate REFUSED it (exit 2)" "$RUNNER_TEMP/drill.out"
